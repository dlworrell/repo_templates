name: Verify Repository

on:
  workflow_dispatch:
    inputs:
      profile:
        description: P0 verification profile
        required: true
        default: .aems/project-zero/profiles/default/profile.json
        type: string
  pull_request:
  push:
    branches: [main, dev-daily, fitment]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify distributed AES-SEC-001 templates
        run: |
          cmp .clang-tidy shared/config/.clang-tidy
          cmp .clang-tidy shared/config/clang-tidy-aes-sec-001.yml
          cmp \
            .github/workflows/aes-sec-001-governance.yml \
            shared/github/workflows/aes-sec-001-governance.yml
      - name: Verify repository rulesets
        run: |
          python3 tools/verify_rulesets.py
          python3 -m unittest discover -s tests -v
      - name: Run repository verification
        shell: bash
        run: |
          set -o pipefail
          mkdir -p build
          profile="${{ inputs.profile || '.aems/project-zero/profiles/default/profile.json' }}"
          python3 tools/project_zero.py verify \
            --repository-state existing \
            --profile "$profile" \
            --output build/verification-report \
            | tee build/verification-console.log
      - name: Publish verification summary
        if: always()
        shell: bash
        run: |
          if [[ -f build/verification-report/executive-summary.md ]]; then
            cat build/verification-report/executive-summary.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verification-report-${{ github.run_id }}
          path: |
            build/verification-report/
            build/verification-console.log
          if-no-files-found: warn
          retention-days: 90
