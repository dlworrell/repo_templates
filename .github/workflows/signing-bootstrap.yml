name: Verified signing hardening (bootstrap)
on:
  push:
    branches: [bootstrap/signing-hardening-20261025]
permissions:
  contents: write
concurrency:
  group: signing-hardening-${{ github.repository }}
  cancel-in-progress: false
jobs:
  verified-repair:
    if: github.event_name == 'push' && github.actor == 'dlworrell'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Publish and verify exact reviewed tree
        env:
          GITHUB_TOKEN: ${{ github.token }}
          EXPECTED_PAYLOAD_SHA256: 05cb8ba533a03453a93b566d34e919d55d6f407648772a2e9cac394ccaf6fc19
          EXPECTED_BOOTSTRAP_BRANCH: bootstrap/signing-hardening-20261025
        run: python3 .github/signing-repair/publish.py
